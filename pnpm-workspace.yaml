allowBuilds:
  "@whiskeysockets/baileys": false
  protobufjs: false

# Nothing published in the last 30 days gets installed (43200 minutes — the unit is minutes, not
# days). Compromised npm releases are almost always caught and unpublished within days, so waiting
# a month turns "first victim" into "someone else already found it". Applies to transitive
# dependencies too, which is where a supply-chain attack actually lands.
#
# When this blocks an upgrade you genuinely need sooner, add the package to minimumReleaseAgeExclude
# rather than lowering the number — an exception should be visible and per-package.
minimumReleaseAge: 43200

# Deliberate, visible exceptions to the 30-day wait (see the note above: exclude per-package
# rather than lowering the global number, so the shield stays on for the ~190 other entries —
# including transitive runtime deps, which is where a supply-chain attack actually lands).
#
# Bumped by hand on 2026-09-14 while these were 0-1 days old:
#   zod 3 -> 4      runtime; breaking major, tested green against test_allowlist.mjs
#   oxfmt, oxlint   dev-only (formatter/linter), never shipped
# The @oxfmt/* and @oxlint/* entries are their per-platform native bindings, which are versioned
# in lockstep and would otherwise fail the check one architecture at a time.
minimumReleaseAgeExclude:
  - zod
  - oxfmt
  - oxlint
  - "@oxfmt/*"
  - "@oxlint/*"
  # Transitive dep of oxfmt@0.68.0, pulled in by that bump. Dev-only and 22 days old at the time
  # (not a 0-day release), so the risk profile is much milder than the entries above.
  - tinypool
  # Security floor (owner decision, 2026-10-23: a CVE fix may skip the 30-day wait). ip-address 10.7.4
  # was published 2026-10-11T19:32Z and clears the 30-day wait on 2026-11-10T19:32Z. Remove this entry
  # after that time (pnpm rejects the lockfile until then without it).
  - ip-address
  # Security fixes taken on 2026-11-10 (same owner decision: a CVE fix may skip the 30-day wait). Ages on that day:
  # body-parser 2.4.0 18 days, fast-uri 3.1.9 21 days, qs 6.16.1 26 days. Remove each entry once its
  # version is past 30 days (qs about 2026-11-14, fast-uri 2026-11-18, body-parser 2026-11-21).
  - body-parser
  - fast-uri
  - qs

# Security floors for transitive dependencies (pnpm audit, 2026-10-23): the oldest patched release
# of each. All of them are past the 30-day wait except ip-address (see its exception above); the
# temporary exceptions for hono, sharp, @img/* and @modelcontextprotocol/sdk were removed on
# 2026-11-10. Drop an entry here when the parent package ships the fixed version itself; checked
# on 2026-11-10 and not yet the case (for example @modelcontextprotocol/sdk 1.32.1 still declares
# hono ^4.11.4).
overrides:
  proxy-addr: 2.0.8
  body-parser: 2.4.0
  fast-uri: 3.1.9
  ip-address: 10.7.4
  qs: 6.16.1
  hono: 4.13.11
  "@hono/node-server": 2.1.4
  music-metadata: 11.16.0
  sharp: 0.35.5

